<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>YoPropongo.pe</title>
    <script>
      // SPA redirect trick for GitHub Pages
      // Stores the full path in sessionStorage and redirects to index.html
      var path = window.location.pathname;
      var base = '/yopropongo';
      // Strip the base from the path for storage
      var route = path.startsWith(base) ? path.slice(base.length) : path;
      sessionStorage.setItem('spa_redirect', route + window.location.search + window.location.hash);
      window.location.replace(base + '/');
    </script>
  </head>
  <body></body>
</html>
